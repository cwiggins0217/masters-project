  - name: Set Password Minimum Length in login.defs
    block:

    - name: Set Password Minimum Length in login.defs - Deduplicate values from /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        create: false
        regexp: (?i)(?i)^\s*{{ "PASS_MIN_LEN"| regex_escape }}\s+
        state: absent

    - name: Set Password Minimum Length in login.defs - Check if the parameter PASS_MIN_LEN
        is present in /etc/login.defs.d
      ansible.builtin.find:
        paths: /etc/login.defs.d
        recurse: 'yes'
        follow: 'no'
        contains: (?i)^\s*{{ "PASS_MIN_LEN"| regex_escape }}\s+
        patterns:
        - '*.defs'
      register: login_defs_d_has_parameter

    - name: Set Password Minimum Length in login.defs - Remove parameter from files
        in /etc/login.defs.d
      ansible.builtin.lineinfile:
        path: '{{ item.path }}'
        create: false
        regexp: (?i)(?i)^\s*{{ "PASS_MIN_LEN"| regex_escape }}\s+
        state: absent
      with_items: '{{ login_defs_d_has_parameter.files }}'

    - name: Set Password Minimum Length in login.defs - Insert correct line to /etc/login.defs.d/oscap.login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs.d/oscap.login.defs
        create: true
        regexp: (?i)(?i)^\s*{{ "PASS_MIN_LEN"| regex_escape }}\s+
        line: PASS_MIN_LEN {{ var_accounts_password_minlen_login_defs }}
        state: present
        insertbefore: BOF

    - name: Set Password Minimum Length in login.defs - Add comment in /etc/login.defs.d/oscap.login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs.d/oscap.login.defs
        line: '# Per CCE-95762-1 Set PASS_MIN_LEN {{ var_accounts_password_minlen_login_defs
          }} in /etc/login.defs.d/oscap.login.defs'
        state: present
        insertbefore: PASS_MIN_LEN {{ var_accounts_password_minlen_login_defs }}
      when: not ansible_check_mode
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"shadow" in ansible_facts.packages'
    - PASS_MIN_LEN_login_defs_correctly.matched == 0 or PASS_MIN_LEN_login_defs_has_parameter.matched
      != 1
