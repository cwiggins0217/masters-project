###############################################################################

- name: Ansible Playbook for xccdf_org.ssgproject.content_profile_anssi_bp28_minimal
  hosts: all
  vars:
    var_password_pam_remember: '5'
    var_password_pam_unix_remember: '2'
    var_accounts_passwords_pam_faillock_deny: '3'
    var_accounts_passwords_pam_faillock_fail_interval: '900'
    var_accounts_passwords_pam_faillock_unlock_time: '900'
    var_password_pam_dcredit: '-1'
    var_password_pam_lcredit: '-1'
    var_password_pam_minclass: '4'
    var_password_pam_minlen: '15'
    var_password_pam_ocredit: '-1'
    var_password_pam_retry: '3'
    var_password_pam_ucredit: '-1'
    var_password_hashing_algorithm_pam: sha512
    var_password_hashing_min_rounds_login_defs: '5000'
    var_accounts_password_minlen_login_defs: '15'
    var_accounts_maximum_age_root: '365'
    var_password_pam_unix_rounds: '11'
  tasks:

  - name: Gather the package facts
    ansible.builtin.package_facts:
      manager: auto
    tags:
    - always

  - name: Ensure sequoia-sq is installed
    ansible.builtin.package:
      name: sequoia-sq
      state: present
    when: '"kernel-default" in ansible_facts.packages or "kernel-default-base" in
      ansible_facts.packages or "kernel-azure" in ansible_facts.packages'
    tags:
    - CCE-96148-2
    - PCI-DSSv4-6.3
    - PCI-DSSv4-6.3.3
    - enable_strategy
    - low_complexity
    - low_disruption
    - low_severity
    - no_reboot_needed
    - package_sequoia-sq_installed

  - name: Security patches are up to date
    ansible.builtin.package:
      name: '*'
      state: latest
    tags:
    - CCE-96484-1
    - CJIS-5.10.4.1
    - NIST-800-53-CM-6(a)
    - NIST-800-53-SI-2(5)
    - NIST-800-53-SI-2(c)
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-6.3
    - PCI-DSSv4-6.3.3
    - high_disruption
    - low_complexity
    - medium_severity
    - patch_strategy
    - reboot_required
    - security_patches_up_to_date
    - skip_ansible_lint

  - name: 'Uninstall DHCP Server Package: Ensure dhcp is removed'
    ansible.builtin.package:
      name: dhcp
      state: absent
    tags:
    - CCE-96301-7
    - NIST-800-53-CM-6(a)
    - NIST-800-53-CM-7(a)
    - NIST-800-53-CM-7(b)
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_dhcp_removed

  - name: 'Uninstall kea Package: Ensure kea is removed'
    ansible.builtin.package:
      name: kea
      state: absent
    tags:
    - CCE-96693-7
    - disable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_kea_removed

  - name: 'Uninstall Sendmail Package: Ensure sendmail is removed'
    ansible.builtin.package:
      name: sendmail
      state: absent
    when: '"kernel-default" in ansible_facts.packages or "kernel-default-base" in
      ansible_facts.packages or "kernel-azure" in ansible_facts.packages'
    tags:
    - NIST-800-53-CM-6(a)
    - NIST-800-53-CM-7(a)
    - NIST-800-53-CM-7(b)
    - disable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_sendmail_removed

  - name: 'Uninstall xinetd package if not used by network services: Ensure xinetd
      is removed'
    ansible.builtin.package:
      name: xinetd
      state: absent
    when: '"kernel-default" in ansible_facts.packages or "kernel-default-base" in
      ansible_facts.packages or "kernel-azure" in ansible_facts.packages'
    tags:
    - NIST-800-53-CM-6(a)
    - NIST-800-53-CM-7(a)
    - NIST-800-53-CM-7(b)
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - low_complexity
    - low_disruption
    - low_severity
    - no_reboot_needed
    - package_xinetd_removed

  - name: 'Uninstall talk-server Package: Ensure talk-server is removed'
    ansible.builtin.package:
      name: talk-server
      state: absent
    tags:
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_talk-server_removed

  - name: 'Uninstall talk Package: Ensure talk is removed'
    ansible.builtin.package:
      name: talk
      state: absent
    tags:
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - package_talk_removed

  - name: 'Uninstall telnet-server Package: Ensure telnet-server is removed'
    ansible.builtin.package:
      name: telnet-server
      state: absent
    tags:
    - CCE-96043-5
    - NIST-800-53-CM-6(a)
    - NIST-800-53-CM-7(a)
    - NIST-800-53-CM-7(b)
    - PCI-DSS-Req-2.2.2
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - high_severity
    - low_complexity
    - low_disruption
    - no_reboot_needed
    - package_telnet-server_removed

  - name: 'Remove telnet Clients: Ensure telnet is removed'
    ansible.builtin.package:
      name: telnet
      state: absent
    tags:
    - CCE-96102-9
    - NIST-800-171-3.1.13
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - low_complexity
    - low_disruption
    - low_severity
    - no_reboot_needed
    - package_telnet_removed

  - name: 'Uninstall tftp Package: Ensure tftp is removed'
    ansible.builtin.package:
      name: tftp
      state: absent
    tags:
    - CCE-96578-0
    - NIST-800-53-CM-6(a)
    - NIST-800-53-CM-7(a)
    - NIST-800-53-CM-7(b)
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - high_severity
    - low_complexity
    - low_disruption
    - no_reboot_needed
    - package_tftp-server_removed

  - name: 'Remove tftp Daemon: Ensure tftp is removed'
    ansible.builtin.package:
      name: tftp
      state: absent
    tags:
    - CCE-96201-9
    - PCI-DSSv4-2.2
    - PCI-DSSv4-2.2.4
    - disable_strategy
    - low_complexity
    - low_disruption
    - low_severity
    - no_reboot_needed
    - package_tftp_removed

  - name: Gather the package facts
    ansible.builtin.package_facts:
      manager: auto
    tags:
    - always

  - name: Gather the service facts
    ansible.builtin.service_facts: null
    tags:
    - always

  - name: Ensure gpgcheck Enabled In Main zypper Configuration - Copy distro defaults
      /usr/etc/zypp/zypp.conf to /etc/zypp/zypp.conf
    ansible.builtin.copy:
      src: /usr/etc/zypp/zypp.conf
      dest: /etc/zypp/zypp.conf
      force: false
      mode: preserve
      remote_src: true
    when: '"zypper" in ansible_facts.packages'
    tags:
    - CCE-95809-0
    - CJIS-5.10.4.1
    - NIST-800-171-3.4.8
    - NIST-800-53-CM-11(a)
    - NIST-800-53-CM-11(b)
    - NIST-800-53-CM-5(3)
    - NIST-800-53-CM-6(a)
    - NIST-800-53-SA-12
    - NIST-800-53-SA-12(10)
    - NIST-800-53-SC-12
    - NIST-800-53-SC-12(3)
    - NIST-800-53-SI-7
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-6.3
    - PCI-DSSv4-6.3.3
    - configure_strategy
    - ensure_gpgcheck_globally_activated
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed

  - name: Ensure GPG check is globally activated
    community.general.ini_file:
      dest: /etc/zypp/zypp.conf
      section: main
      option: gpgcheck
      value: 1
      no_extra_spaces: true
      create: true
    when: '"zypper" in ansible_facts.packages'
    tags:
    - CCE-95809-0
    - CJIS-5.10.4.1
    - NIST-800-171-3.4.8
    - NIST-800-53-CM-11(a)
    - NIST-800-53-CM-11(b)
    - NIST-800-53-CM-5(3)
    - NIST-800-53-CM-6(a)
    - NIST-800-53-SA-12
    - NIST-800-53-SA-12(10)
    - NIST-800-53-SC-12
    - NIST-800-53-SC-12(3)
    - NIST-800-53-SI-7
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-6.3
    - PCI-DSSv4-6.3.3
    - configure_strategy
    - ensure_gpgcheck_globally_activated
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed

  - name: Ensure GPG check Enabled for Local Packages (zypper)
    block:

    - name: Check stats of zypper
      ansible.builtin.stat:
        path: /etc/zypp/zypp.conf
      register: pkg

    - name: Check if config file of zypper is a symlink
      ansible.builtin.set_fact:
        pkg_config_file_symlink: '{{ pkg.stat.lnk_target if pkg.stat.lnk_target is
          match("^/.*") else "/etc/zypp/zypp.conf" | dirname ~ "/" ~ pkg.stat.lnk_target
          }}'
      when: pkg.stat.lnk_target is defined

    - name: Ensure GPG check Enabled for Local Packages (zypper)
      community.general.ini_file:
        dest: '{{ pkg_config_file_symlink |  default("/etc/zypp/zypp.conf") }}'
        section: main
        option: localpkg_gpgcheck
        value: 1
        no_extra_spaces: true
        create: true
        mode: 420
    when: '"zypper" in ansible_facts.packages'
    tags:
    - CCE-95830-6
    - NIST-800-171-3.4.8
    - NIST-800-53-CM-11(a)
    - NIST-800-53-CM-11(b)
    - NIST-800-53-CM-5(3)
    - NIST-800-53-CM-6(a)
    - NIST-800-53-SA-12
    - NIST-800-53-SA-12(10)
    - ensure_gpgcheck_local_packages
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed
    - unknown_strategy

  - name: Grep for zypper repo section names
    ansible.builtin.shell: |
      set -o pipefail
      grep -HEr '^\[.+\]' -r /etc/zypp/repos.d/
    register: repo_grep_results
    failed_when: repo_grep_results.rc not in [0, 1]
    changed_when: false
    tags:
    - CCE-96678-8
    - CJIS-5.10.4.1
    - NIST-800-171-3.4.8
    - NIST-800-53-CM-11(a)
    - NIST-800-53-CM-11(b)
    - NIST-800-53-CM-5(3)
    - NIST-800-53-CM-6(a)
    - NIST-800-53-SA-12
    - NIST-800-53-SA-12(10)
    - NIST-800-53-SC-12
    - NIST-800-53-SC-12(3)
    - NIST-800-53-SI-7
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-6.3
    - PCI-DSSv4-6.3.3
    - enable_strategy
    - ensure_gpgcheck_never_disabled
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed

  - name: Set gpgcheck=1 for each zypper repo
    community.general.ini_file:
      path: '{{ item[0] }}'
      section: '{{ item[1] }}'
      option: gpgcheck
      value: '1'
      no_extra_spaces: true
    loop: '{{ repo_grep_results.stdout |regex_findall( ''(.+\.repo):\[(.+)\]\n?''
      ) if repo_grep_results is not skipped else [] }}'
    when: repo_grep_results is not skipped
    tags:
    - CCE-96678-8
    - CJIS-5.10.4.1
    - NIST-800-171-3.4.8
    - NIST-800-53-CM-11(a)
    - NIST-800-53-CM-11(b)
    - NIST-800-53-CM-5(3)
    - NIST-800-53-CM-6(a)
    - NIST-800-53-SA-12
    - NIST-800-53-SA-12(10)
    - NIST-800-53-SC-12
    - NIST-800-53-SC-12(3)
    - NIST-800-53-SI-7
    - PCI-DSS-Req-6.2
    - PCI-DSSv4-6.3
    - PCI-DSSv4-6.3.3
    - enable_strategy
    - ensure_gpgcheck_never_disabled
    - high_severity
    - low_complexity
    - medium_disruption
    - no_reboot_needed

  - name: Limit Password Reuse - Copy distro defaults /usr/lib/pam.d/common-password
      to /etc/pam.d/common-password
    ansible.builtin.copy:
      src: /usr/lib/pam.d/common-password
      dest: /etc/pam.d/common-password
      force: false
      mode: preserve
      remote_src: true
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Set control_flag fact
    ansible.builtin.set_fact:
      control_flag: requisite
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Check to see if 'pam_pwhistory.so' module is configured in '/etc/pam.d/common-password'
    ansible.builtin.shell: |
      set -o pipefail
      grep -E '^\s*password\s+\S+\s+pam_pwhistory.so' /etc/pam.d/common-password || true
    register: check_pam_module_result
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Configure 'pam_pwhistory.so' module in '/etc/pam.d/common-password'
    ansible.builtin.lineinfile:
      path: /etc/pam.d/common-password
      line: password requisite pam_pwhistory.so
      state: present
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    - check_pam_module_result is not skipped and check_pam_module_result.stdout is
      defined and "pam_pwhistory.so" not in check_pam_module_result.stdout
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Ensure 'pam_pwhistory.so' module has conforming control flag
    ansible.builtin.lineinfile:
      path: /etc/pam.d/common-password
      regexp: ^(\s*password\s+)\S+(\s+pam_pwhistory.so\s+.*)
      line: \g<1>requisite\g<2>
      backrefs: true
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    - check_pam_module_result is not skipped and control_flag|length > 0
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Ensure "pam_pwhistory.so" module has argument "remember={{ var_password_pam_remember
      }}"
    ansible.builtin.lineinfile:
      path: /etc/pam.d/common-password
      regexp: ^(\s*password\s+requisite\s+pam_pwhistory.so(?:\s+\S+)*\s+remember=)(?:\S+)((\s+\S+)*\s*\\*\s*)$
      line: \g<1>{{ var_password_pam_remember }}\g<2>
      backrefs: true
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    - check_pam_module_result is not skipped
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Check the presence of "remember" argument in "pam_pwhistory.so" module
    ansible.builtin.shell: |
      set -o pipefail
      grep -E '^\s*password\s+requisite\s+pam_pwhistory.so.*\s+remember(=|\s|\s*$)' /etc/pam.d/common-password || true
    register: check_pam_module_argument_result
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Add "remember" argument to "pam_pwhistory.so" module
    ansible.builtin.lineinfile:
      path: /etc/pam.d/common-password
      regexp: ^(\s*password\s+requisite\s+pam_pwhistory.so)((\s+\S+)*\s*(\\)*$)
      line: \g<1> remember={{ var_password_pam_remember }}\g<2>
      backrefs: true
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    - check_pam_module_argument_result is not skipped and "remember" not in check_pam_module_argument_result.stdout
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Set argument_value fact
    ansible.builtin.set_fact:
      argument_value: ''
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Ensure "pam_pwhistory.so" module has argument "use_authtok"
    ansible.builtin.lineinfile:
      path: /etc/pam.d/common-password
      regexp: ^(\s*password\s+requisite\s+pam_pwhistory.so(?:\s+\S+)*\s+use_authtok=)(?!)\S*((\s+\S+)*\s*\\*\s*)$
      line: \g<1>\g<2>
      backrefs: true
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    - argument_value|length > 0
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Check the presence of "use_authtok" argument in "pam_pwhistory.so" module
    ansible.builtin.shell: |
      set -o pipefail
      grep -E '^\s*password\s+requisite\s+pam_pwhistory.so.*\s+use_authtok(=|\s|\s*$)' /etc/pam.d/common-password || true
    register: check_pam_module_argument_result
    when:
    - '"kernel-default" in ansible_facts.packages or "kernel-default-base" in ansible_facts.packages
      or "kernel-azure" in ansible_facts.packages'
    - '"pam" in ansible_facts.packages'
    tags:
    - CCE-95993-2
    - accounts_password_pam_pwhistory_remember
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed
    - restrict_strategy

  - name: Add "use_authtok" argument to "pam_pwhistory.so" module
    ansible.builtin.lineinfile:
